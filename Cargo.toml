[workspace]
resolver = "2"
members = ["crates/opentela-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
opentela-core = { path = "crates/opentela-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
